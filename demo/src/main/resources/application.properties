server.port=3000

# Google Gemini API (set via env: GEMINI_API_KEY)
gemini.api.key=${GEMINI_API_KEY}
gemini.model=gemini-2.5-flash

# Serve index.html at /
spring.web.resources.static-locations=classpath:/static/
